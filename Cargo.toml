[package]
name = "py_mapper"
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
default-run = "pymapper"
description = "Python static analysis and confidence-labelled call graphs in Rust"

[lib]
name = "py_mapper"
path = "src/lib.rs"

[[bin]]
name = "pymapper"
path = "src/main.rs"

[[bin]]
name = "pymapper-v1"
path = "src/v1_main.rs"

[dependencies]
tree-sitter = "0.26"
tree-sitter-python = "0.25"
petgraph = "0.8"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ratatui = "0.30"
crossterm = "0.29"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }
rayon = "1"
jwalk = "0.8"
tempfile = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "benchmarks"
harness = false
